#  compressione gzip abilitata 
gzip on;
#  dico che il contenuto può variare al browser sulla base della compressione
gzip_vary on;

# Comprime anche per chi arriva da un proxy
gzip_proxied any;

# livello di compressione , potrei mettere quello che preferisco
gzip_comp_level 6;
# da qui specifico che file vado a comprimere. cioè i tipi di file
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    image/svg+xml;

# questo mi serve per creare la cache per tutti  file statici
location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|otf|ttf|svg)$ {
    expires 6M;
    access_log off;
    add_header Cache-Control "public";
}