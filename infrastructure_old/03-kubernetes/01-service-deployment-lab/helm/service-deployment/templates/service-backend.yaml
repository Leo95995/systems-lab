apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-backend" (include "service-deployment-app.fullname" .) }}
  labels:
    {{ include "service-deployment-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP # Accesso solo interno (dal Frontend)
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: {{ .Release.Name }}