server { 
# reindirizza tutto ciò he arriva al proxy 
  listen 80 default_server;
#   rimane universale su qualsiasi ip arrivo
    server_name tf-ansible-lab.leolab.dev www.tf-ansible-lab.leolab.dev;
    return 301 https://$host$request_uri;

}

server  {
    listen 443 ssl;
    server_name tf-ansible-lab.leolab.dev www.tf-ansible-lab.leolab.dev;

    ssl_certificate /etc/letsencrypt/live/tf-ansible-lab.leolab.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tf-ansible-lab.leolab.dev/privkey.pem;

    location / {
        # Redireziono la porta 80 al container sulla 8080
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # predisposizione per backend python
    location /api/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host $host;
    }
}

