# Per l'accesso HTTP/HTTPS esterno.
# Sostituisce NodePort/LoadBalancer in produzione.
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dev-vault-app.fullname" . }}
  labels:
    {{- include "dev-vault-app.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "traefik" }}
  rules:
    - host: {{ .Values.ingress.host | default "" }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-frontend" (include "dev-vault-app.fullname" .) }}
                port:
                  number: {{ .Values.frontend.service.port | default 80 }}
{{- end }}
