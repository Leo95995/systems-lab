# Variabili sensibili del backend in questo caso db URL
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql://app:!ChangeMe!@deployment-service-service-deployment-app-db:5432/app"
